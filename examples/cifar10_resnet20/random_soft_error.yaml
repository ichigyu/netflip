schema_version: "2026.1"
run_id: cifar10-resnet20-random-soft-error
model:
  benchmark: cifar10-resnet20
  architecture: resnet20
  num_classes: 10
  checkpoint:
    path: checkpoints/cifar10/resnet20-int8.pt
    format: pytorch-state-dict
  quantization:
    codec: signed-int8-two-complement
    scale_granularity: per-tensor
    scale_path: checkpoints/cifar10/resnet20-int8-scales.json
dataset:
  name: cifar10
  root: data/cifar10
  selection_split: train
  evaluation_split: test
scenario:
  type: soft_error
  fault_model: uniform-eligible-bit
  fault_schedule: one-bit-step
  fault_budget:
    max_flip_count: 128
  rng_seed: 2026
output_dir: runs/cifar10-resnet20/random-soft-error
