[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netflip"
version = "0.1.0"
description = "Neural-network bit-flip reliability evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "NetFlip contributors" },
]
keywords = [
  "bit-flip",
  "neural-network",
  "reliability",
  "soft-error",
  "bfa",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1,<9.0",
]

[project.scripts]
netflip = "netflip.console:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7,<8",
  "nox>=2025.5.1,<2027",
  "pytest>=8,<9",
  "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["netflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["netflip"]
omit = [
  ".nox/*",
  "tests/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
