[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netflip"
version = "0.1.0"
description = "Neural-network bit-flip reliability evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "NetFlip contributors" },
]
keywords = [
  "bit-flip",
  "neural-network",
  "reliability",
  "soft-error",
  "bfa",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "beartype>=0.20,<1",
  "click>=8.1,<9.0",
  "pydantic>=2.11,<3",
]

[project.scripts]
netflip = "netflip.console:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7,<8",
  "nox>=2025.5.1,<2027",
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "ruff>=0.13,<1",
  "sphinx>=7.4,<9",
  "tomli>=2,<3",
  "twine>=6,<7",
  "xdoctest>=1.2,<2",
]
test = [
  "coverage[toml]>=7,<8",
  "pytest>=8,<9",
  "xdoctest>=1.2,<2",
]
typing = [
  "pyright>=1.1,<2",
]
docs = [
  "sphinx>=7.4,<9",
]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["netflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
xdoctest_encoding = "utf-8"

[tool.coverage.run]
branch = true
source = ["netflip"]
omit = [
  ".nox/*",
  "tests/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.uv]
required-version = ">=0.9.0"
