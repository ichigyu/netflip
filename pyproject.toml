[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netflip"
version = "0.1.0"
description = "Neural-network bit-flip reliability evaluation framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "NetFlip contributors" },
]
keywords = [
  "bit-flip",
  "neural-network",
  "reliability",
  "soft-error",
  "bfa",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.4,<1",
]

[project.scripts]
netflip = "netflip.cli:main"

# Keep these in sync with project.optional-dependencies.dev so Poetry and
# pip-based development workflows resolve the same tool constraints.
[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.4,<1"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
