name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run nox -s tests-${{ matrix.python-version }}

  checks:
    name: Quality, Docs, And Release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: >
          uv run nox -s doctests coverage lint format typecheck docs release
      - uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true
